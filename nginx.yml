- name: Install and configure Nginx
  hosts: all
  become: yes
  gather_facts: no

  vars:
    server_port: "80"
    server_domain: "localhost"
    doc_root: "/var/www/html"
    index_root: "index.html"
    error_log: "/var/log/nginx/error.log"
    access_log: "/var/log/nginx/access.log"

  tasks:

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Ensure Nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Copy website files
      ansible.builtin.copy:
        src: /home/synnefo/ansible/gold/
        dest: /var/www/html
        owner: nginx
        group: nginx
        mode: '0644'

    - name: Deploy nginx configuration template
      ansible.builtin.template:
        src: /home/synnefo/ansible/nginx.conf.j2
        dest: /etc/nginx/conf.d/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted